x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-example_password}@db:5432/${POSTGRES_DB:-app_db}
  WATCHPACK_POLLING: "true"
  NODE_OPTIONS: --max-old-space-size=4096

x-app-volumes: &app-volumes
  - ./src:/app
  - /app/node_modules
  - /app/.next

services:
  app:
    build:
      context: .
      target: development
    init: true
    tty: true
    stdin_open: true
    environment: *app-environment
    volumes: *app-volumes
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  debug:
    profiles: [debug]
    build:
      context: .
      target: development
    init: true
    tty: true
    stdin_open: true
    environment: *app-environment
    volumes: *app-volumes
    command:
      - node_modules/.bin/next
      - dev
      - --inspect
      - 0.0.0.0:9229
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    ports:
      - "127.0.0.1:${DEBUG_APP_PORT:-3001}:3000"
      - "127.0.0.1:${DEBUG_PORT:-9229}:9229"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      target: development
    environment: *app-environment
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  studio:
    profiles: [tools]
    build:
      context: .
      target: development
    init: true
    environment: *app-environment
    volumes: *app-volumes
    command: ["npx", "prisma", "studio", "--hostname", "0.0.0.0", "--port", "5555"]
    ports:
      - "127.0.0.1:${PRISMA_STUDIO_PORT:-5555}:5555"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
