services:
  migrate:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  production:
    build:
      context: .
      target: production
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${PRODUCTION_DATABASE_URL:?PRODUCTION_DATABASE_URL is required}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?TRUSTED_ORIGINS is required}
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY must be explicitly set to true or false}
    ports:
      - "127.0.0.1:${PRODUCTION_APP_PORT:-3002}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  maintenance:
    profiles: [maintenance]
    build:
      context: .
      target: development
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${PRODUCTION_DATABASE_URL:?PRODUCTION_DATABASE_URL is required}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      REVOKED_SESSION_RETENTION_DAYS: ${REVOKED_SESSION_RETENTION_DAYS:-7}
    command: ["npm", "run", "maintenance:cleanup"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
