name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        # Prisma 6 exposes its development CLI as an optional peer of the runtime client.
        # Audit the dependencies shipped in the standalone production image.
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage -- --ci --runInBand --passWithNoTests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb

      - name: Upload coverage
        if: always() && hashFiles('src/coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: src/coverage/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose --profile debug --profile tools config --quiet

      - name: Build development image and start stack
        run: docker compose up --build --wait app

      - name: Verify migrations
        run: docker compose run --rm migrate

      - name: Build production image
        run: docker build --target production --tag tanari-chan:ci .

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
