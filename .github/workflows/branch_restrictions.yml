name: Branch policy

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-base-branch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}

    steps:
      - name: Enforce main branch promotion policy
        shell: bash
        run: |
          echo "Checking branch policy: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"

          if [[ "${TARGET_BRANCH}" == "main" && "${SOURCE_BRANCH}" != "develop" ]]; then
            echo "Pull requests to main must come from develop."
            echo "Expected promotion path: feature -> develop -> main"
            exit 1
          fi

          echo "Branch policy passed."

      - name: Show pull request metadata
        shell: bash
        run: |
          echo "Branch: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"
          echo "Title: ${PR_TITLE}"
          echo "Author: ${PR_AUTHOR}"
