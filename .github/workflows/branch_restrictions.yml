name: Branch policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-base-branch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}

    steps:
      - name: Enforce main branch policy
        shell: bash
        run: |
          echo "Checking branch policy: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"

          if [[ "${SOURCE_BRANCH}" == "develop" ]]; then
            echo "The develop branch has been retired. Open pull requests to main from a working branch."
            echo "Expected flow: working branch -> main"
            exit 1
          fi

          echo "Branch policy passed."

      - name: Show pull request metadata
        shell: bash
        run: |
          echo "Branch: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"
          echo "Title: ${PR_TITLE}"
          echo "Author: ${PR_AUTHOR}"
